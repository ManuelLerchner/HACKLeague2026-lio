services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: chaser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: chaser
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaser"]
      interval: 3s
      retries: 10
  api:
    profiles: ["app"]
    build: .
    command: ["pixi", "run", "--locked", "uvicorn", "supplier_chaser.web.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env with host db}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["evidence:/app/.data"]
    depends_on:
      db: {condition: service_healthy}
  worker:
    profiles: ["app"]
    build: .
    command: ["pixi", "run", "--locked", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env with host db}
    volumes: ["evidence:/app/.data"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres:
  evidence:
