[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supplier-chaser"
version = "0.1.0"
description = "Evidence-backed supplier commitment inbox"
requires-python = ">=3.12,<3.13"

[tool.hatch.build.targets.wheel]
packages = ["src/supplier_chaser"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["freeze: deterministic replay and frozen-time regression", "postgres: PostgreSQL concurrency tests", "live: opt-in external connection checks"]

[tool.mypy]
python_version = "3.12"
files = ["src/supplier_chaser"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
